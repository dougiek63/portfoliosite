<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Placeholder</title>
    <style>
        body, html {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
        }
        
        .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            font-size: 1.2rem;
        }
        
        /* Hide all placeholders by default */
        .placeholder {
            display: none;
        }
        
        /* Show the profile placeholder by default */
        .profile {
            display: flex;
            background: linear-gradient(135deg, #0078d4, #50b0e6);
        }
        
        /* Project placeholders with different Azure blue shades */
        .project1 {
            background: linear-gradient(135deg, #0078d4, #50b0e6);
        }
        
        .project2 {
            background: linear-gradient(135deg, #0078d4, #00b7c3);
        }
        
        .project3 {
            background: linear-gradient(135deg, #50b0e6, #00b7c3);
        }
        
        .project4 {
            background: linear-gradient(135deg, #0078d4, #004e8c);
        }
        
        .project5 {
            background: linear-gradient(135deg, #50b0e6, #81d4fa);
        }
        
        .project6 {
            background: linear-gradient(135deg, #00b7c3, #4fc3f7);
        }
    </style>
</head>
<body>
    <div class="placeholder profile">Doug Kim<br>AI Design Manager</div>
    <div class="placeholder project1">AI Assistant Dashboard</div>
    <div class="placeholder project2">Healthcare Chatbot</div>
    <div class="placeholder project3">Predictive Analytics Tool</div>
    <div class="placeholder project4">Smart Home Interface</div>
    <div class="placeholder project5">Data Visualization Platform</div>
    <div class="placeholder project6">Retail AI Assistant</div>
    
    <script>
        // Show the appropriate placeholder based on URL hash
        function showPlaceholder() {
            // Get the hash from the URL (e.g., #project1)
            const hash = window.location.hash.substring(1);
            
            // Hide all placeholders
            const placeholders = document.querySelectorAll('.placeholder');
            placeholders.forEach(p => p.style.display = 'none');
            
            // If there's a hash, show the corresponding placeholder
            if (hash) {
                const targetPlaceholder = document.querySelector('.' + hash);
                if (targetPlaceholder) {
                    targetPlaceholder.style.display = 'flex';
                } else {
                    // If no matching placeholder, show profile as default
                    document.querySelector('.profile').style.display = 'flex';
                }
            } else {
                // If no hash, show profile as default
                document.querySelector('.profile').style.display = 'flex';
            }
        }
        
        // Run on page load
        showPlaceholder();
        
        // Run when hash changes
        window.addEventListener('hashchange', showPlaceholder);
    </script>
</body>
</html>
